name: Deploy MC KeepAlive Bot to Unikraft Cloud

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Unikraft CLI
        uses: unikraft/setup-action@v1
        with:
          token: ${{ secrets.KRAFTCLOUD_TOKEN }}

      - name: Build Unikernel Image
        run: |
          unikraft build . --output yili/mc-keepalive-bot:latest

      - name: Deploy to Unikraft Cloud (Singapore metro)
        run: |
          # If instance exists, remove it first to recreate with new image
          unikraft --metro=sin instances delete mc-keepalive-bot || true
          
          # Run instance常驻无休眠
          unikraft run \
            --metro=sin \
            --name=mc-keepalive-bot \
            --memory=128MiB \
            -e MC_HOST="144.31.46.15" \
            -e MC_PORT="10486" \
            -e PORT="8080" \
            -p 8080:8080 \
            --image=yili/mc-keepalive-bot:latest
