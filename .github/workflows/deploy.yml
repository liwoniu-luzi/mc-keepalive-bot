name: Deploy MC KeepAlive Bot to Unikraft Cloud

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Unikraft CLI
        uses: unikraft/setup-action@v1
        with:
          token: ${{ secrets.KRAFTCLOUD_TOKEN }}

      - name: Deploy to Unikraft Cloud (Singapore metro)
        env:
          UKC_TOKEN: ${{ secrets.KRAFTCLOUD_TOKEN }}
          KRAFTCLOUD_TOKEN: ${{ secrets.KRAFTCLOUD_TOKEN }}
        run: |
          unikraft deploy \
            --name mc-keepalive-bot \
            --metro sin \
            --memory 128 \
            --scale-to-zero=false \
            --env MC_HOST="144.31.46.15" \
            --env MC_PORT="10486" \
            --env PORT="8080" \
            -p 8080:8080 \
            .
